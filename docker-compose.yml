services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: procure_to_pay
      DB_USERNAME: p2p
      DB_PASSWORD: p2p_local_password
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: procure_to_pay
      MYSQL_USER: p2p
      MYSQL_PASSWORD: p2p_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    volumes:
      - p2p_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  p2p_mysql:
